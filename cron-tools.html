<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cron 表达式助手 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">⏰ Cron 表达式生成助手</h2>
        </div>

        <!-- 常用预设一键复制 -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">常用定时任务快速复制：</label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm">
                <div class="flex items-center justify-between p-2 bg-gray-50 border rounded">
                    <span>每分钟执行一次</span>
                    <button onclick="quickCopy('*/1 * * * *')" class="font-mono bg-blue-100 text-blue-800 px-2 py-0.5 rounded hover:bg-blue-200">*/1 * * * *</button>
                </div>
                <div class="flex items-center justify-between p-2 bg-gray-50 border rounded">
                    <span>每小时整点执行</span>
                    <button onclick="quickCopy('0 * * * *')" class="font-mono bg-blue-100 text-blue-800 px-2 py-0.5 rounded hover:bg-blue-200">0 * * * *</button>
                </div>
                <div class="flex items-center justify-between p-2 bg-gray-50 border rounded">
                    <span>每天凌晨0点执行</span>
                    <button onclick="quickCopy('0 0 * * *')" class="font-mono bg-blue-100 text-blue-800 px-2 py-0.5 rounded hover:bg-blue-200">0 0 * * *</button>
                </div>
                <div class="flex items-center justify-between p-2 bg-gray-50 border rounded">
                    <span>每周一凌晨2点</span>
                    <button onclick="quickCopy('0 2 * * 1')" class="font-mono bg-blue-100 text-blue-800 px-2 py-0.5 rounded hover:bg-blue-200">0 2 * * 1</button>
                </div>
            </div>
        </div>

        <hr class="border-gray-100 my-4">

        <!-- 反向直观解读 -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">简易 Cron 表达式解读 (5位)：</label>
            <input type="text" id="cron-input" value="0 12 * * *" class="w-full p-2 border border-gray-300 font-mono text-center text-lg rounded-lg focus:ring-2 focus:ring-blue-500">
            <button onclick="explainCron()" class="w-full mt-2 bg-gray-900 text-white py-1.5 rounded text-sm hover:bg-gray-800">解析表达式</button>
            
            <div id="cron-result" class="mt-4 p-3 bg-yellow-50 text-sm text-yellow-900 rounded-lg hidden font-mono"></div>
        </div>
    </div>

    <script>
        function quickCopy(val) {
            navigator.clipboard.writeText(val);
            alert(`已复制: ${val}`);
        }

        function explainCron() {
            const exp = document.getElementById('cron-input').value.trim();
            const parts = exp.split(/\s+/);
            if(parts.length !== 5) {
                alert('仅支持标准的 5 位 Linux Cron 表达式（分 时 日 月 周）');
                return;
            }

            const [m, h, d, M, w] = parts;
            let result = `💡 任务执行计划解读：\n`;
            result += `• 分钟: ${m === '*' ? '每分钟' : m + '分'}\n`;
            result += `• 小时: ${h === '*' ? '每小时' : h + '点'}\n`;
            result += `• 日期: ${d === '*' ? '每天' : d + '号'}\n`;
            result += `• 月份: ${M === '*' ? '每月' : M + '月'}\n`;
            result += `• 星期: ${w === '*' ? '每周任何一天' : '星期' + w}`;

            const resDiv = document.getElementById('cron-result');
            resDiv.innerText = result;
            resDiv.style.whiteSpace = "pre-line";
            resDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
