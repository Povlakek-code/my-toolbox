<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高阶打砖块 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 flex flex-col items-center justify-center">
    <div class="max-w-md w-full bg-white p-5 rounded-2xl shadow-xl text-center border">
        <div class="text-left mb-3 flex justify-between items-center">
            <div>
                <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
                <h2 class="text-lg font-bold text-slate-800 mt-0.5">🧱 道具打砖块</h2>
            </div>
            <div class="font-mono text-sm font-bold text-blue-600">
                SCORE: <span id="brick-score">0</span>
            </div>
        </div>
        
        <div class="bg-slate-900 rounded-xl overflow-hidden inline-block p-1 cursor-none" id="brick-container">
            <canvas id="brickCanvas" width="360" height="320"></canvas>
        </div>

        <button onclick="initBrickGame()" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-sm font-semibold transition-all">发射核心球</button>
        <p class="text-xs text-slate-400 mt-2.5">🎁 提示：接住掉落的 <span class="text-emerald-500 font-bold">🟢 增益道具</span> 可以让挡板疯狂加长！</p>
    </div>

    <script>
        const canvas = document.getElementById("brickCanvas");
        const ctx = canvas.getContext("2d");

        let ballX, ballY, dx, dy;
        let paddleX, paddleWidth = 60;
        const paddleHeight = 10, ballRadius = 6;
        let bricks = [], items = [];
        let score = 0, brickLoop = null;
        
        const rowCount = 4, colCount = 6;
        const bWidth = 50, bHeight = 15, bPadding = 7, bOffsetTop = 25, bOffsetLeft = 13;

        document.getElementById("brick-container").addEventListener("mousemove", e => {
            const rect = canvas.getBoundingClientRect();
            paddleX = e.clientX - rect.left - paddleWidth / 2;
        });

        function initBrickGame() {
            score = 0; paddleWidth = 60;
            document.getElementById("brick-score").innerText = 0;
            ballX = canvas.width / 2; ballY = canvas.height - 30;
            dx = 2.5; dy = -2.5;
            paddleX = (canvas.width - paddleWidth) / 2;

            // 铺设随机彩色矩阵砖块
            bricks = []; items = [];
            const colors = ["#ef4444", "#f97316", "#3b82f6", "#10b981"];
            for(let c=0; c<colCount; c++) {
                bricks[c] = [];
                for(let r=0; r<rowCount; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1, color: colors[r], hasItem: Math.random() < 0.35 };
                }
            }
            if(brickLoop) clearInterval(brickLoop);
            brickLoop = setInterval(drawBrickGame, 1000 / 60);
        }

        function drawBrickGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. 渲染并检测砖块碰撞
            for(let c=0; c<colCount; c++) {
                for(let r=0; r<rowCount; r++) {
                    let b = bricks[c][r];
                    if(b.status === 1) {
                        let bx = c * (bWidth + bPadding) + bOffsetLeft;
                        let by = r * (bHeight + bPadding) + bOffsetTop;
                        b.x = bx; b.y = by;

                        ctx.fillStyle = b.color;
                        ctx.fillRect(bx, by, bWidth, bHeight);

                        // 弹球对砖块的碰撞矩阵算法
                        if(ballX > bx && ballX < bx + bWidth && ballY > by && ballY < by + bHeight) {
                            dy = -dy; b.status = 0;
                            score += 10;
                            document.getElementById("brick-score").innerText = score;
                            // 触发道具掉落机制
                            if(b.hasItem) {
                                items.push({ x: bx + bWidth/2, y: by + bHeight, speed: 2 });
                            }
                        }
                    }
                }
            }

            // 2. 道具更新流
            items.forEach((item, idx) => {
                item.y += item.speed;
                ctx.fillStyle = "#22c55e"; // 绿色惊喜道具
                ctx.beginPath();
                ctx.arc(item.x, item.y, 5, 0, Math.PI*2);
                ctx.fill();

                // 挡板接住道具判定
                if(item.y >= canvas.height - paddleHeight - 5 && item.x > paddleX && item.x < paddleX + paddleWidth) {
                    paddleWidth += 25; // 长度剧增
                    items.splice(idx, 1);
                }
                if(item.y > canvas.height) items.splice(idx, 1);
            });

            // 3. 物理反弹壁垒
            if(ballX + dx > canvas.width - ballRadius || ballX + dx < ballRadius) dx = -dx;
            if(ballY + dy < ballRadius) dy = -dy;
            else if(ballY + dy > canvas.height - ballRadius - paddleHeight) {
                if(ballX > paddleX && ballX < paddleX + paddleWidth) {
                    dy = -dy;
                } else {
                    clearInterval(brickLoop);
                    alert("游戏结束！核心球已坠落空域。");
                    return;
                }
            }

            ballX += dx; ballY += dy;

            // 4. 绘制弹球
            ctx.beginPath();
            ctx.arc(ballX, ballY, ballRadius, 0, Math.PI*2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            // 5. 绘制挡板
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(paddleX, canvas.height - paddleHeight - 5, paddleWidth, paddleHeight);
        }
    </script>
</body>
</html>
