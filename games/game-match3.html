<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝石三消乐 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .gem { transition: all 0.2s ease-in-out; }
        .selected { border: 3px solid #ffffff !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 flex flex-col items-center justify-center">
    <div class="max-w-xs w-full bg-white p-5 rounded-2xl shadow-xl text-center border">
        <div class="text-left mb-3 flex justify-between items-center">
            <div>
                <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
                <h2 class="text-lg font-bold text-slate-800 mt-0.5">💎 宝石三消乐</h2>
            </div>
            <div class="font-mono text-sm font-bold text-purple-600">
                SCORE: <span id="match-score">0</span>
            </div>
        </div>
        
        <!-- 6x6 矩阵消除面板 -->
        <div id="match-board" class="grid grid-cols-6 gap-1.5 bg-slate-800 p-2 rounded-xl aspect-square shadow-inner">
            <!-- 动态生成 -->
        </div>

        <button onclick="initMatchGame()" class="w-full mt-4 bg-purple-600 hover:bg-purple-500 text-white py-2 rounded-xl text-sm font-semibold transition-all">重组宝石矩阵</button>
        <p class="text-xs text-slate-400 mt-2.5">💡 玩法：点击两颗相邻的宝石交换位置，连成 3 个即可消除！</p>
    </div>

    <script>
        const size = 6;
        let board = [];
        let score = 0;
        let selectedIdx = null;

        // 颜色映射矩阵
        const colors = [
            'bg-rose-500',   // 红
            'bg-sky-500',    // 蓝
            'bg-amber-400',  // 黄
            'bg-emerald-500',// 绿
            'bg-purple-500'  // 紫
        ];

        function initMatchGame() {
            score = 0; selectedIdx = null;
            document.getElementById('match-score').innerText = score;
            
            // 循环生成不包含开局即消除的随机矩阵
            do {
                board = [];
                for (let i = 0; i < size * size; i++) {
                    board.push(Math.floor(Math.random() * colors.length));
                }
            } while (checkMatches().length > 0);

            renderBoard();
        }

        function renderBoard() {
            const container = document.getElementById('match-board');
            container.innerHTML = '';
            
            board.forEach((colorIdx, i) => {
                const gem = document.createElement('div');
                gem.className = `gem ${colors[colorIdx]} rounded-lg cursor-pointer border-2 border-transparent flex items-center justify-center shadow-md`;
                if(selectedIdx === i) gem.classList.add('selected');
                
                // 内部高光水晶颗粒感
                gem.innerHTML = `<div class="w-3 h-3 bg-white/20 rounded-full blur-xs -mt-2 -ml-2"></div>`;
                gem.onclick = () => handleGemClick(i);
                container.appendChild(gem);
            });
        }

        function handleGemClick(i) {
            if (selectedIdx === null) {
                selectedIdx = i;
                renderBoard();
            } else {
                let p1 = selectedIdx, p2 = i;
                selectedIdx = null;

                // 验证是不是相邻的方块（上、下、左、右）
                let r1 = Math.floor(p1/size), c1 = p1 % size;
                let r2 = Math.floor(p2/size), c2 = p2 % size;
                let isAdjacent = (Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1;

                if (isAdjacent) {
                    // 试探性位置对调
                    swap(p1, p2);
                    let matches = checkMatches();
                    
                    if (matches.length > 0) {
                        // 真的合规，执行瀑布式连击消除逻辑
                        eliminate(matches);
                    } else {
                        // 无法消除，不合规，再原样反向对调回去
                        swap(p1, p2);
                        renderBoard();
                    }
                } else {
                    renderBoard();
                }
            }
        }

        function swap(i, j) {
            let temp = board[i]; board[i] = board[j]; board[j] = temp;
        }

        function checkMatches() {
            let matchGems = new Set();
            
            // 横向扫描
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size - 2; c++) {
                    let idx = r * size + c;
                    if (board[idx] === board[idx+1] && board[idx] === board[idx+2]) {
                        matchGems.add(idx); matchGems.add(idx+1); matchGems.add(idx+2);
                    }
                }
            }
            // 纵向扫描
            for (let c = 0; c < size; c++) {
                for (let r = 0; r < size - 2; r++) {
                    let idx = r * size + c;
                    if (board[idx] === board[idx+size] && board[idx] === board[idx+size*2]) {
                        matchGems.add(idx); matchGems.add(idx+size); matchGems.add(idx+size*2);
                    }
                }
            }
            return Array.from(matchGems);
        }

        function eliminate(matches) {
            score += matches.length * 10;
            document.getElementById('match-score').innerText = score;

            // 1. 将消除位标记清除
            matches.forEach(idx => board[idx] = null);
            renderBoard();

            // 2. 延迟执行核心下落矩阵重绘动画
            setTimeout(() => {
                for (let c = 0; c < size; c++) {
                    for (let r = size - 1; r >= 0; r--) {
                        let idx = r * size + c;
                        if (board[idx] === null) {
                            // 往上寻找非空宝石下落覆盖
                            for (let k = r - 1; k >= 0; k--) {
                                let topIdx = k * size + c;
                                if (board[topIdx] !== null) {
                                    board[idx] = board[topIdx];
                                    board[topIdx] = null;
                                    break;
                                }
                            }
                            // 如果最上方空了，重新坠落填充一颗新随机宝石
                            if (board[idx] === null) {
                                board[idx] = Math.floor(Math.random() * colors.length);
                            }
                        }
                    }
                }
                renderBoard();

                // 3. 递归链式检测：检查下落后是否引发连锁连击效应(Combo)
                let nextMatches = checkMatches();
                if(nextMatches.length > 0) eliminate(nextMatches);
            }, 250);
        }

        window.onload = initMatchGame;
    </script>
</body>
</html>
