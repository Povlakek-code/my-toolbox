<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>经典贪吃蛇 | 高级版</title>
  <style>
    :root{
      --bg:#020617;
      --panel:#0b1220cc;
      --panel-strong:#0b1220f2;
      --line:#1f2937;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --accent:#22c55e;
      --accent-2:#38bdf8;
      --danger:#ef4444;
      --warn:#f59e0b;
      --shadow: 0 24px 80px rgba(0,0,0,.45);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(56,189,248,.14), transparent 35%),
        radial-gradient(circle at bottom, rgba(34,197,94,.10), transparent 28%),
        linear-gradient(180deg, #020617 0%, #0f172a 45%, #020617 100%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .shell {
      width: min(100%, 920px);
      display: grid;
      gap: 18px;
      grid-template-columns: 1.15fr .85fr;
      align-items: stretch;
    }

    @media (max-width: 860px) {
      .shell {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: linear-gradient(180deg, rgba(15,23,42,.82), rgba(2,6,23,.88));
      border: 1px solid rgba(148,163,184,.16);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      border-radius: var(--radius);
    }

    .game-card {
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .side-card {
      padding: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .back-link {
      color: #93c5fd;
      text-decoration: none;
      font-size: 14px;
      opacity: .95;
    }

    .back-link:hover { text-decoration: underline; }

    h1 {
      margin: 6px 0 8px;
      font-size: clamp(24px, 3vw, 34px);
      letter-spacing: .02em;
      line-height: 1.1;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 16px 0;
    }

    @media (max-width: 560px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
    }

    .stat {
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(15,23,42,.66);
      border: 1px solid rgba(148,163,184,.12);
    }

    .stat .label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .stat .value {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .value.green { color: #86efac; }
    .value.blue { color: #7dd3fc; }
    .value.orange { color: #fdba74; }
    .value.red { color: #fca5a5; }

    .stage {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(148,163,184,.16);
      background:
        radial-gradient(circle at 50% 0%, rgba(56,189,248,.10), transparent 30%),
        linear-gradient(180deg, rgba(2,6,23,.98), rgba(15,23,42,.98));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      background: transparent;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(2,6,23,.25), rgba(2,6,23,.72));
      padding: 22px;
      text-align: center;
    }

    .overlay.hidden { display: none; }

    .overlay-box {
      max-width: 360px;
      width: 100%;
      padding: 22px 18px;
      border-radius: 22px;
      background: rgba(15,23,42,.82);
      border: 1px solid rgba(148,163,184,.18);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }

    .overlay-box h2 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .overlay-box p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .overlay-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 16px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease, background .15s ease;
      color: white;
      min-width: 118px;
    }

    .btn:active { transform: translateY(1px) scale(.99); }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #22c55e);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #334155, #0f172a);
      border: 1px solid rgba(148,163,184,.18);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #f97316);
    }

    .controls {
      display: grid;
      gap: 14px;
    }

    .panel {
      padding: 16px;
      border-radius: 20px;
      background: rgba(15,23,42,.6);
      border: 1px solid rgba(148,163,184,.12);
    }

    .panel h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .tips {
      display: grid;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      padding: 2px 8px;
      border-radius: 10px;
      margin: 0 4px;
      color: #e2e8f0;
      background: rgba(148,163,184,.12);
      border: 1px solid rgba(148,163,184,.16);
      font-weight: 700;
      font-size: 12px;
    }

    .touchpad {
      display: grid;
      gap: 8px;
      justify-items: center;
      margin-top: 14px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .touch-row {
      display: flex;
      gap: 8px;
    }

    .touch-btn {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 800;
      color: #e2e8f0;
      background: rgba(30,41,59,.82);
      border: 1px solid rgba(148,163,184,.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
      cursor: pointer;
    }

    .touch-btn:active {
      transform: translateY(1px);
      background: rgba(51,65,85,.92);
    }

    .footer-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .status-line {
      margin-top: 10px;
      min-height: 22px;
      color: #cbd5e1;
      font-size: 13px;
      opacity: .95;
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="card game-card">
      <div class="topbar">
        <div>
          <a class="back-link" href="./index.html">← 返回首页</a>
          <h1>🐍 经典贪吃蛇</h1>
          <p class="subtitle">更流畅的动画、更完整的状态、更像一款正式小游戏。</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="label">当前得分</span>
          <span id="score" class="value green">0</span>
        </div>
        <div class="stat">
          <span class="label">最高得分</span>
          <span id="highScore" class="value blue">0</span>
        </div>
        <div class="stat">
          <span class="label">当前速度</span>
          <span id="speed" class="value orange">1</span>
        </div>
        <div class="stat">
          <span class="label">游戏状态</span>
          <span id="state" class="value red">待开始</span>
        </div>
      </div>

      <div class="stage">
        <canvas id="gameCanvas" width="480" height="480"></canvas>

        <div id="overlay" class="overlay">
          <div class="overlay-box">
            <h2 id="overlayTitle">准备开始</h2>
            <p id="overlayText">
              点击开始，或按 <span class="key">Enter</span> 进入游戏。<br>
              使用方向键 / <span class="key">W A S D</span> 控制移动，<span class="key">Space</span> 暂停。
            </p>
            <div class="overlay-actions">
              <button id="startBtn" class="btn btn-primary">开始游戏</button>
              <button id="restartBtn" class="btn btn-secondary">重新开始</button>
            </div>
          </div>
        </div>
      </div>

      <div class="status-line" id="statusLine">提示：不要直接反向移动，连续吃到食物后速度会提升。</div>
    </section>

    <aside class="card side-card">
      <div class="controls">
        <div class="panel">
          <h3>操作说明</h3>
          <div class="tips">
            <div>移动：<span class="key">↑ ↓ ← →</span> 或 <span class="key">W A S D</span></div>
            <div>开始：<span class="key">Enter</span></div>
            <div>暂停/继续：<span class="key">Space</span></div>
            <div>重开：<span class="key">R</span></div>
          </div>
        </div>

        <div class="panel">
          <h3>手机触控</h3>
          <div class="touchpad" aria-label="触控方向键">
            <div class="touch-row">
              <button class="touch-btn" data-dir="up">↑</button>
            </div>
            <div class="touch-row">
              <button class="touch-btn" data-dir="left">←</button>
              <button class="touch-btn" data-dir="down">↓</button>
              <button class="touch-btn" data-dir="right">→</button>
            </div>
          </div>
        </div>

        <div class="panel">
          <h3>玩法增强</h3>
          <div class="tips">
            <div>• 采用更平滑的帧循环，不会有明显卡顿感</div>
            <div>• 吃到食物后得分提升，速度逐步增加</div>
            <div>• 最高分会自动保存到本地</div>
          </div>
        </div>
      </div>
      <div class="footer-note">建议直接替换原文件，保持单页即可运行。</div>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("highScore");
    const speedEl = document.getElementById("speed");
    const stateEl = document.getElementById("state");
    const statusLineEl = document.getElementById("statusLine");

    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");

    const GRID = 24;
    const CELL = canvas.width / GRID; // 20
    const STORAGE_KEY = "snake_high_v2";

    let snake, food, dir, nextDir, score, highScore, state, level;
    let lastTime = 0;
    let accumulator = 0;
    let stepMs = 140;
    let rafId = null;

    highScore = Number(localStorage.getItem(STORAGE_KEY) || 0);
    highScoreEl.textContent = highScore;

    function initGame(keepState = false) {
      snake = [
        { x: 11, y: 12 },
        { x: 10, y: 12 },
        { x: 9, y: 12 },
        { x: 8, y: 12 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      level = 1;
      stepMs = 140;
      if (!keepState) state = "ready";
      scoreEl.textContent = score;
      speedEl.textContent = level;
      stateEl.textContent = "待开始";
      stateEl.className = "value red";
      generateFood();
      draw();
      updateOverlay();
      updateStatus("准备好了。点击开始，或按 Enter 直接进入游戏。");
    }

    function setState(newState) {
      state = newState;
      if (state === "playing") {
        stateEl.textContent = "进行中";
        stateEl.className = "value green";
        overlay.classList.add("hidden");
      } else if (state === "paused") {
        stateEl.textContent = "已暂停";
        stateEl.className = "value orange";
        overlay.classList.remove("hidden");
        overlayTitle.textContent = "已暂停";
        overlayText.innerHTML = '按 <span class="key">Space</span> 继续，或按 <span class="key">R</span> 重新开始。';
        startBtn.textContent = "继续游戏";
      } else if (state === "over") {
        stateEl.textContent = "结束";
        stateEl.className = "value red";
        overlay.classList.remove("hidden");
      } else {
        stateEl.textContent = "待开始";
        stateEl.className = "value red";
        overlay.classList.remove("hidden");
      }
    }

    function updateOverlay() {
      if (state === "playing") {
        overlay.classList.add("hidden");
        return;
      }

      overlay.classList.remove("hidden");
      if (state === "over") {
        overlayTitle.textContent = "游戏结束";
        overlayText.innerHTML = `本局得分 <strong>${score}</strong>，最高分 <strong>${highScore}</strong>。<br>按 <span class="key">R</span> 或点击重新开始，再来一局。`;
        startBtn.textContent = "再来一局";
      } else if (state === "paused") {
        overlayTitle.textContent = "已暂停";
        overlayText.innerHTML = '按 <span class="key">Space</span> 继续，或按 <span class="key">R</span> 重新开始。';
        startBtn.textContent = "继续游戏";
      } else {
        overlayTitle.textContent = "准备开始";
        overlayText.innerHTML =
          '点击开始，或按 <span class="key">Enter</span> 进入游戏。<br>' +
          '使用方向键 / <span class="key">W A S D</span> 控制移动，<span class="key">Space</span> 暂停。';
        startBtn.textContent = "开始游戏";
      }
    }

    function updateStatus(text) {
      statusLineEl.textContent = text;
    }

    function generateFood() {
      do {
        food = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
      } while (snake.some(part => part.x === food.x && part.y === food.y));
    }

    function samePos(a, b) {
      return a.x === b.x && a.y === b.y;
    }

    function isOpposite(a, b) {
      return a.x === -b.x && a.y === -b.y;
    }

    function setDirection(x, y) {
      const proposed = { x, y };
      if (!isOpposite(proposed, dir)) {
        nextDir = proposed;
      }
    }

    function updateSpeed() {
      level = 1 + Math.floor(score / 30);
      stepMs = Math.max(70, 140 - (level - 1) * 8);
      speedEl.textContent = level;
    }

    function gameOver() {
      setState("over");
      updateOverlay();
      if (score > highScore) {
        highScore = score;
        localStorage.setItem(STORAGE_KEY, String(highScore));
        highScoreEl.textContent = highScore;
        updateStatus("新纪录已保存。");
      } else {
        updateStatus("本局结束。点击重新开始再来一局。");
      }
    }

    function step() {
      dir = nextDir;

      const head = {
        x: snake[0].x + dir.x,
        y: snake[0].y + dir.y
      };

      if (
        head.x < 0 || head.x >= GRID ||
        head.y < 0 || head.y >= GRID ||
        snake.some((part, index) => index !== snake.length - 1 && samePos(part, head))
      ) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (samePos(head, food)) {
        score += 10;
        scoreEl.textContent = score;
        updateSpeed();
        generateFood();
        updateStatus("吃到食物！速度提升了。");
      } else {
        snake.pop();
      }
    }

    function drawRoundRect(x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function drawGrid() {
      ctx.save();
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.globalAlpha = 0.18;
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 1;

      for (let i = 0; i <= GRID; i++) {
        const p = i * CELL + 0.5;
        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, p);
        ctx.lineTo(canvas.width, p);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawFood() {
      const x = food.x * CELL;
      const y = food.y * CELL;
      const t = performance.now() / 180;
      const pulse = 1 + Math.sin(t) * 0.06;
      const size = CELL * 0.78 * pulse;
      const pad = (CELL - size) / 2;

      const grad = ctx.createRadialGradient(
        x + CELL / 2, y + CELL / 2, 2,
        x + CELL / 2, y + CELL / 2, CELL / 2
      );
      grad.addColorStop(0, "#fff7ed");
      grad.addColorStop(0.22, "#fb7185");
      grad.addColorStop(1, "#ef4444");

      ctx.save();
      ctx.fillStyle = grad;
      drawRoundRect(x + pad, y + pad, size, size, 7);
      ctx.fill();

      ctx.globalAlpha = 0.35;
      ctx.fillStyle = "#fecaca";
      drawRoundRect(x + pad + 3, y + pad + 3, size - 6, size - 6, 6);
      ctx.fill();
      ctx.restore();
    }

    function drawSnake() {
      snake.forEach((part, index) => {
        const x = part.x * CELL;
        const y = part.y * CELL;
        const inset = index === 0 ? 2 : 3;
        const size = CELL - inset * 2;
        const radius = index === 0 ? 8 : 6;

        const grad = ctx.createLinearGradient(x, y, x + CELL, y + CELL);
        if (index === 0) {
          grad.addColorStop(0, "#86efac");
          grad.addColorStop(1, "#22c55e");
        } else {
          const ratio = index / snake.length;
          grad.addColorStop(0, `rgba(34,197,94,${0.96 - ratio * 0.18})`);
          grad.addColorStop(1, `rgba(16,185,129,${0.88 - ratio * 0.18})`);
        }

        ctx.save();
        ctx.fillStyle = grad;
        drawRoundRect(x + inset, y + inset, size, size, radius);
        ctx.fill();

        if (index === 0) {
          ctx.fillStyle = "rgba(15,23,42,.65)";
          const eyeSize = 3;
          const ex1 = x + CELL * 0.62;
          const ex2 = x + CELL * 0.62;
          const ey1 = y + CELL * 0.34;
          const ey2 = y + CELL * 0.62;
          ctx.beginPath();
          ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
          ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });
    }

    function drawHudGlow() {
      ctx.save();
      const g = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 40,
        canvas.width / 2, canvas.height / 2, canvas.width / 1.4
      );
      g.addColorStop(0, "rgba(34,197,94,.04)");
      g.addColorStop(1, "rgba(34,197,94,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    function draw() {
      drawGrid();
      drawHudGlow();
      drawFood();
      drawSnake();

      if (state !== "playing") {
        ctx.save();
        ctx.fillStyle = "rgba(2,6,23,.14)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }
    }

    function loop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const delta = timestamp - lastTime;
      lastTime = timestamp;

      if (state === "playing") {
        accumulator += delta;
        while (accumulator >= stepMs) {
          step();
          accumulator -= stepMs;
          if (state !== "playing") break;
        }
      } else {
        accumulator = 0;
      }

      draw();
      rafId = requestAnimationFrame(loop);
    }

    function startGame() {
      if (state === "over" || state === "ready") {
        initGame(true);
      }
      setState("playing");
      updateOverlay();
      updateStatus("游戏开始。保持节奏，别撞墙。");
    }

    function pauseGame() {
      if (state === "playing") {
        setState("paused");
        updateOverlay();
        updateStatus("已暂停。");
      }
    }

    function resumeGame() {
      if (state === "paused") {
        setState("playing");
        updateOverlay();
        updateStatus("继续游戏。");
      }
    }

    function togglePause() {
      if (state === "playing") pauseGame();
      else if (state === "paused") resumeGame();
      else if (state === "ready") startGame();
    }

    function restartGame() {
      initGame(true);
      setState("playing");
      updateOverlay();
      updateStatus("已重新开始。");
    }

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();

      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "w", "a", "s", "d", "enter", "r"].includes(key)) {
        e.preventDefault();
      }

      if (key === "arrowup" || key === "w") setDirection(0, -1);
      if (key === "arrowdown" || key === "s") setDirection(0, 1);
      if (key === "arrowleft" || key === "a") setDirection(-1, 0);
      if (key === "arrowright" || key === "d") setDirection(1, 0);

      if (key === " ") togglePause();
      if (key === "enter") {
        if (state === "ready" || state === "over") startGame();
        else if (state === "paused") resumeGame();
      }
      if (key === "r") restartGame();
    }, { passive: false });

    startBtn.addEventListener("click", () => {
      if (state === "paused") resumeGame();
      else startGame();
    });

    restartBtn.addEventListener("click", restartGame);

    document.querySelectorAll(".touch-btn").forEach(btn => {
      const dirName = btn.dataset.dir;
      const map = {
        up: [0, -1],
        down: [0, 1],
        left: [-1, 0],
        right: [1, 0]
      };

      btn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const [x, y] = map[dirName];
        setDirection(x, y);
        if (state === "ready") startGame();
      });
    });

    initGame();
    state = "ready";
    updateOverlay();
    updateStatus("点击开始，或者按 Enter 进入游戏。");
    rafId = requestAnimationFrame(loop);
  </script>
</body>
</html>
