<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际雷电 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">
    <div class="max-w-md w-full bg-slate-800 p-5 rounded-2xl shadow-2xl border border-slate-700 text-center">
        <div class="text-left mb-3 flex justify-between items-center">
            <div>
                <a href="./index.html" class="text-xs text-blue-400 hover:underline">← 返回首页</a>
                <h2 class="text-lg font-bold text-white mt-0.5">🚀 星际雷电</h2>
            </div>
            <div class="font-mono text-sm bg-slate-950 px-3 py-1 rounded text-emerald-400">
                SCORE: <span id="shoot-score">0</span>
            </div>
        </div>
        
        <div class="bg-black rounded-xl overflow-hidden inline-block p-1 border-2 border-slate-700 cursor-none" id="canvas-container">
            <canvas id="shooterCanvas" width="360" height="460"></canvas>
        </div>

        <button onclick="startShooter()" class="w-full mt-4 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-xl text-sm font-semibold transition-all shadow-lg shadow-blue-900/40">启动主武器</button>
        <p class="text-xs text-slate-400 mt-2.5">💡 操作：在黑框内【移动鼠标】控制战机，左右躲避弹幕</p>
    </div>

    <script>
        const canvas = document.getElementById("shooterCanvas");
        const ctx = canvas.getContext("2d");

        let player = { x: 180, y: 400, size: 16, speed: 5 };
        let bullets = [], enemies = [], particles = [];
        let score = 0, gameLoop = null, spawnTimer = 0, bulletTimer = 0;
        let isRunning = false;

        // 绑定鼠标事件
        document.getElementById("canvas-container").addEventListener("mousemove", e => {
            if (!isRunning) return;
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left;
            player.y = e.clientY - rect.top;
            // 边界锁死
            if (player.x < 10) player.x = 10;
            if (player.x > canvas.width - 10) player.x = canvas.width - 10;
        });

        function spawnParticle(x, y, color) {
            for(let i=0; i<8; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    alpha: 1,
                    color
                });
            }
        }

        function updateShooter() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.3)"; // 拖尾星空特效
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. 自动开火
            bulletTimer++;
            if (bulletTimer % 8 === 0) {
                bullets.push({ x: player.x, y: player.y - 15, speed: 7 });
            }

            // 2. 渲染玩家子弹
            bullets.forEach((b, index) => {
                b.y -= b.speed;
                ctx.fillStyle = "#38bdf8";
                ctx.fillRect(b.x - 2, b.y, 4, 10);
                if (b.y < 0) bullets.splice(index, 1);
            });

            // 3. 敌机生成流
            spawnTimer++;
            if (spawnTimer % 35 === 0) {
                enemies.push({
                    x: Math.random() * (canvas.width - 20) + 10,
                    y: -10,
                    speed: Math.random() * 2 + 1.5,
                    size: Math.random() * 10 + 10,
                    hp: 1
                });
            }

            // 4. 敌机状态逻辑
            enemies.forEach((e, eIdx) => {
                e.y += e.speed;
                
                // 绘制敌机（红魔）
                ctx.fillStyle = "#ef4444";
                ctx.beginPath();
                ctx.moveTo(e.x, e.y + e.size);
                ctx.lineTo(e.x - e.size, e.y - e.size);
                ctx.lineTo(e.x + e.size, e.y - e.size);
                ctx.fill();

                // 碰撞检测：玩家子弹击中敌机
                bullets.forEach((b, bIdx) => {
                    let dist = Math.hypot(b.x - e.x, b.y - e.y);
                    if (dist < e.size + 4) {
                        bullets.splice(bIdx, 1);
                        spawnParticle(e.x, e.y, "#ef4444");
                        enemies.splice(eIdx, 1);
                        score += 100;
                        document.getElementById("shoot-score").innerText = score;
                    }
                });

                // 碰撞检测：敌机撞击玩家
                let pDist = Math.hypot(player.x - e.x, player.y - e.y);
                if (pDist < e.size + player.size) {
                    gameOver();
                }

                if (e.y > canvas.height + 20) enemies.splice(eIdx, 1);
            });

            // 5. 渲染爆炸碎片粒子
            particles.forEach((p, pIdx) => {
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
                if (p.alpha <= 0) particles.splice(pIdx, 1);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fillRect(p.x, p.y, 3, 3);
                ctx.globalAlpha = 1.0;
            });

            // 6. 绘制玩家核心机体
            ctx.fillStyle = "#a855f7";
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.size);
            ctx.lineTo(player.x - player.size, player.y + player.size);
            ctx.lineTo(player.x + player.size, player.y + player.size);
            ctx.fill();
            // 机翼核心指示灯
            ctx.fillStyle = "#f43f5e";
            ctx.beginPath();
            ctx.arc(player.x, player.y + 2, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameOver() {
            isRunning = false;
            clearInterval(gameLoop);
            spawnParticle(player.x, player.y, "#a855f7");
            alert(`【警报】战机已坠毁！拦截积分: ${score}`);
        }

        function startShooter() {
            bullets = []; enemies = []; particles = []; score = 0;
            document.getElementById("shoot-score").innerText = 0;
            isRunning = true;
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(updateShooter, 1000 / 60);
        }
    </script>
</body>
</html>
