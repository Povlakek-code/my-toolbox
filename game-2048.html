<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .cell-0 { background: #cbd5e1; color: transparent; }
        .cell-2 { background: #eee4da; color: #776e65; }
        .cell-4 { background: #ede0c8; color: #776e65; }
        .cell-8 { background: #f2b179; color: #f9f6f2; }
        .cell-16 { background: #f59563; color: #f9f6f2; }
        .cell-32 { background: #f67c5f; color: #f9f6f2; }
        .cell-64 { background: #f65e3b; color: #f9f6f2; }
        .cell-128 { background: #edcf72; color: #f9f6f2; }
        .cell-256 { background: #edcc61; color: #f9f6f2; }
        .cell-512 { background: #edc850; color: #f9f6f2; }
        .cell-1024 { background: #edc53f; color: #f9f6f2; }
        .cell-2048 { background: #edc22e; color: #f9f6f2; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6 flex flex-col items-center">
    <div class="max-w-xs w-full bg-white p-6 rounded-xl shadow-md text-center">
        <div class="text-left mb-4 flex justify-between items-center">
            <div>
                <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
                <h2 class="text-2xl font-black mt-1 text-slate-700">2048</h2>
            </div>
            <div class="bg-slate-100 p-2 rounded text-right font-mono">
                <span class="text-xs text-slate-400 block">SCORE</span>
                <span id="score-2048" class="text-base font-bold text-slate-700">0</span>
            </div>
        </div>
        
        <!-- 4x4 网格面板 -->
        <div id="grid-container" class="grid grid-cols-4 gap-2 bg-slate-400 p-2 rounded-lg aspect-square">
            <!-- 由 JS 动态渲染 -->
        </div>

        <button onclick="init2048()" class="w-full mt-4 bg-orange-500 text-white py-2 rounded-lg text-sm font-medium hover:bg-orange-600">新游戏</button>
    </div>

    <script>
        let board = Array(16).fill(0);
        let score = 0;

        function init2048() {
            board = Array(16).fill(0);
            score = 0;
            generateTile();
            generateTile();
            updateUI();
        }

        function generateTile() {
            let empties = board.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
            if (empties.length === 0) return;
            let idx = empties[Math.floor(Math.random() * empties.length)];
            board[idx] = Math.random() < 0.9 ? 2 : 4;
        }

        function updateUI() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            board.forEach(val => {
                const cell = document.createElement('div');
                cell.className = `cell-${val} flex items-center justify-center font-bold text-lg rounded aspect-square transition-all duration-100`;
                cell.innerText = val === 0 ? '' : val;
                container.appendChild(cell);
            });
            document.getElementById('score-2048').innerText = score;
        }

        // 处理单行向左滑动合并逻辑
        function slideRow(row) {
            let arr = row.filter(val => val);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                }
            }
            while (arr.length < 4) arr.push(0);
            return arr;
        }

        function rotateBoard() {
            let next = Array(16).fill(0);
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    next[c * 4 + (3 - r)] = board[r * 4 + c];
                }
            }
            board = next;
        }

        function move(dir) { // 0:左, 1:下, 2:右, 3:上
            let oldStr = board.toString();
            // 通过旋转矩阵，将上下右的移动全部转化为“向左滑动”后再旋回来
            for (let i = 0; i < dir; i++) rotateBoard();
            
            for (let i = 0; i < 4; i++) {
                let start = i * 4;
                let row = board.slice(start, start + 4);
                let newRow = slideRow(row);
                board.splice(start, 4, ...newRow);
            }
            
            let remainingRotations = (4 - dir) % 4;
            for (let i = 0; i < remainingRotations; i++) rotateBoard();

            if (board.toString() !== oldStr) {
                generateTile();
                updateUI();
                checkGameOver();
            }
        }

        function checkGameOver() {
            if (board.includes(0)) return;
            // 检查相邻是否还能合并
            for (let i = 0; i < 16; i++) {
                if (i % 4 < 3 && board[i] === board[i + 1]) return;
                if (i < 12 && board[i] === board[i + 4]) return;
            }
            alert(`游戏结束！您的最终得分是: ${score}`);
        }

        document.addEventListener('keydown', e => {
            if (e.keyCode === 37) move(0); // Left
            if (e.keyCode === 40) move(1); // Down
            if (e.keyCode === 39) move(2); // Right
            if (e.keyCode === 38) move(3); // Up
        });

        window.onload = init2048;
    </script>
</body>
</html>
