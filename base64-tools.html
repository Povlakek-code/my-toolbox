<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 编解码 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">🔒 Base64 编码/解码</h2>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">输入常规文本 / Base64 字符串:</label>
                <textarea id="b64-text" rows="6" class="w-full p-3 border border-gray-300 rounded-lg font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="在此输入需要处理的内容..."></textarea>
            </div>

            <div class="flex gap-2">
                <button onclick="convertB64('encode')" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700 flex-1">Text → Base64 (编码)</button>
                <button onclick="convertB64('decode')" class="bg-emerald-600 text-white px-4 py-2 rounded text-sm hover:bg-emerald-700 flex-1">Base64 → Text (解码)</button>
            </div>

            <div id="b64-error" class="text-sm text-red-600 hidden"></div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">转换结果:</label>
                <div class="relative">
                    <textarea id="b64-result" rows="6" readonly class="w-full p-3 border border-gray-300 rounded-lg font-mono text-sm bg-gray-50 focus:outline-none" placeholder="转换结果将在此处显示..."></textarea>
                    <button onclick="copyB64()" class="absolute top-2 right-2 text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded hover:bg-gray-300">复制</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function convertB64(action) {
            const input = document.getElementById('b64-text').value;
            const resultBox = document.getElementById('b64-result');
            const errorDiv = document.getElementById('b64-error');
            errorDiv.classList.add('hidden');

            try {
                if (action === 'encode') {
                    // 支持中文字符的 Base64 编码方式
                    resultBox.value = btoa(encodeURIComponent(input).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                        return String.fromCharCode('0x' + p1);
                    }));
                } else {
                    // 支持中文字符的 Base64 解码方式
                    resultBox.value = decodeURIComponent(atob(input).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                }
            } catch (e) {
                errorDiv.innerText = '⚠️ 转换失败，请检查输入格式是否正确。';
                errorDiv.classList.remove('hidden');
                resultBox.value = '';
            }
        }

        function copyB64() {
            const res = document.getElementById('b64-result').value;
            if(!res) return;
            navigator.clipboard.writeText(res);
            alert('已复制到剪贴板！');
        }
    </script>
</body>
</html>
