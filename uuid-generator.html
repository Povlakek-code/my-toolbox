<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID 生成器 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">🆔 批量 UUID 随机生成器</h2>
        </div>
        <button onclick="generateUUIDs()" class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm hover:bg-blue-700">随机生成 5 个 UUID</button>
        <textarea id="uuid-res" rows="6" readonly class="w-full mt-4 p-2 bg-gray-50 border font-mono text-xs rounded-lg focus:outline-none"></textarea>
    </div>
    <script>
        function generateUUIDs() {
            let res = [];
            for(let i=0; i<5; i++) {
                res.push(crypto.randomUUID());
            }
            document.getElementById('uuid-res').value = res.join('\n');
        }
        window.onload = generateUUIDs;
    </script>
</body>
</html>
