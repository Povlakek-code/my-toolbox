<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典贪吃蛇 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6 flex flex-col items-center">
    <div class="max-w-md w-full bg-white p-6 rounded-xl shadow-md text-center">
        <div class="text-left mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-xl font-bold mt-1">🐍 经典贪吃蛇</h2>
        </div>
        <div class="flex justify-between items-center mb-4 font-mono text-sm">
            <div>当前得分: <span id="score" class="font-bold text-blue-600">0</span></div>
            <div>最高得分: <span id="high-score" class="font-bold text-gray-500">0</span></div>
        </div>
        <div class="bg-slate-900 rounded-lg overflow-hidden flex justify-center p-1 shadow-inner">
            <canvas id="gameCanvas" width="300" height="300" class="bg-slate-900 outline-none"></canvas>
        </div>
        <button id="start-btn" onclick="resetGame()" class="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-blue-700">开始 / 重新开始</button>
        <p class="text-xs text-slate-400 mt-3">💡 提示：使用键盘方向键 (↑ ↓ ← →) 控制方向</p>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 15;
        const tileCount = canvas.width / gridSize;
        
        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5};
        let dx = 1, dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snake_high") || 0;
        let gameInterval = null;

        document.getElementById("high-score").innerText = highScore;

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            if (keyPressed === 37 && dx === 0) { dx = -1; dy = 0; }
            if (keyPressed === 38 && dy === 0) { dx = 0; dy = -1; }
            if (keyPressed === 39 && dx === 0) { dx = 1; dy = 0; }
            if (keyPressed === 40 && dy === 0) { dx = 0; dy = 1; }
        }

        function drawGame() {
            // 移动蛇头
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            // 边界或自身碰撞检测
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || collision(head)) {
                clearInterval(gameInterval);
                alert(`游戏结束！得分：${score}`);
                if(score > highScore) {
                    localStorage.setItem("snake_high", score);
                    document.getElementById("high-score").innerText = score;
                }
                return;
            }

            snake.unshift(head);

            // 吃食物检测
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                generateFood();
            } else {
                snake.pop();
            }

            // 清屏
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 画食物
            ctx.fillStyle = "#ef4444";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

            // 画蛇
            ctx.fillStyle = "#10b981";
            snake.forEach((part, index) => {
                if(index === 0) ctx.fillStyle = "#34d399"; // 蛇头颜色稍浅
                else ctx.fillStyle = "#10b981";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function collision(head) {
            return snake.some((part, index) => index !== 0 && part.x === head.x && part.y === head.y);
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        }

        function resetGame() {
            clearInterval(gameInterval);
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            document.getElementById("score").innerText = score;
            generateFood();
            gameInterval = setInterval(drawGame, 100);
        }
    </script>
</body>
</html>
