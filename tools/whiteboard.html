<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简白板 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4 flex flex-col">
    <div class="max-w-4xl w-full mx-auto bg-white p-4 rounded-xl shadow-md flex flex-col flex-grow">
        <div class="flex justify-between items-center mb-2">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <div class="flex items-center gap-3">
                <input type="color" id="paint-color" class="w-8 h-8 rounded cursor-pointer" value="#000000">
                <input type="range" id="paint-size" min="1" max="20" value="5" class="w-24">
                <button onclick="clearCanvas()" class="bg-red-500 text-white px-3 py-1 text-xs rounded hover:bg-red-600">清空</button>
            </div>
        </div>
        <div class="flex-grow border border-gray-200 rounded-lg overflow-hidden bg-slate-50 relative min-h-[400px]">
            <canvas id="paint-canvas" class="absolute top-0 left-0 w-full h-full cursor-crosshair"></canvas>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('paint-canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        window.addEventListener('resize', resizeCanvas);
        window.onload = () => { resizeCanvas(); };

        canvas.addEventListener('mousedown', (e) => { drawing = true; draw(e); });
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineWidth = document.getElementById('paint-size').value;
            ctx.strokeStyle = document.getElementById('paint-color').value;
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
