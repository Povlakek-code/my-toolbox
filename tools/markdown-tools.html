<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 预览器 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 为右侧渲染出的原生 HTML 补充样式标签 */
        .prose h1 { font-size: 1.8rem; font-weight: bold; margin-bottom: 0.5rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.3rem;}
        .prose h2 { font-size: 1.4rem; font-weight: bold; margin-top: 1rem; margin-bottom: 0.4rem;}
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.5rem;}
        .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.5rem;}
        .prose p { margin-bottom: 0.5rem; line-height: 1.6; }
        .prose code { background: #f3f4f6; padding: 2px 4px; font-family: monospace; border-radius: 4px; font-size: 0.875rem;}
        .prose pre { background: #1f2937; color: white; padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 0.85rem; margin: 0.5rem 0; overflow-x: auto;}
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col p-6">
    <div class="max-w-6xl w-full mx-auto bg-white p-6 rounded-xl shadow-md flex flex-col flex-grow">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">📝 Markdown 实时预览器</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-grow">
            <!-- 源码输入 -->
            <div class="flex flex-col">
                <label class="block text-sm font-medium text-gray-700 mb-1">Markdown 源码:</label>
                <textarea id="md-input" class="w-full flex-grow p-3 border border-gray-300 rounded-lg font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 min-h-[350px]" placeholder="# 标题一&#10;请输入一些 **加粗** 或 `代码`..." oninput="renderMarkdown()"></textarea>
            </div>
            <!-- 效果预览 -->
            <div class="flex flex-col">
                <label class="block text-sm font-medium text-gray-700 mb-1">实时预览效果:</label>
                <div id="md-preview" class="prose w-full flex-grow p-3 border border-gray-200 bg-gray-50 rounded-lg overflow-y-auto min-h-[350px]"></div>
            </div>
        </div>
    </div>

    <script>
        function renderMarkdown() {
            const rawText = document.getElementById('md-input').value;
            // 使用 marked 转换成 html 并注入
            document.getElementById('md-preview').innerHTML = marked.parse(rawText);
        }
        // 初始化默认运行一次
        window.onload = () => {
            document.getElementById('md-input').value = "# 欢迎使用 Markdown 预览器\n\n这是一个**实时同步**的预览工具。\n\n### 支持的特性：\n- 列表\n- `行内代码`\n- 粗体与斜体\n\n```javascript\nconsole.log('Hello GitHub Pages!');\n
```";
            renderMarkdown();
        }
    </script>
</body>
</html>
