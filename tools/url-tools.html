<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL 编码/解码工具 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">🔗 URL 编码/解码</h2>
        </div>

        <div class="space-y-4">
            <textarea id="url-input" rows="5" class="w-full p-3 border border-gray-300 rounded-lg font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="在这里输入要处理的 URL 或字符串..."></textarea>
            
            <div class="flex gap-2">
                <button onclick="handleUrl('encode')" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700 flex-1">URL 编码 (Encode)</button>
                <button onclick="handleUrl('decode')" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm hover:bg-indigo-700 flex-1">URL 解码 (Decode)</button>
            </div>

            <textarea id="url-output" rows="5" readonly class="w-full p-3 border border-gray-300 rounded-lg font-mono text-sm bg-gray-50 focus:outline-none" placeholder="处理结果显示在这里..."></textarea>
            
            <button onclick="navigator.clipboard.writeText(document.getElementById('url-output').value); alert('已复制！')" class="w-full bg-gray-200 text-gray-700 py-1.5 rounded text-sm hover:bg-gray-300">复制结果</button>
        </div>
    </div>

    <script>
        function handleUrl(action) {
            const input = document.getElementById('url-input').value;
            const output = document.getElementById('url-output');
            try {
                if (action === 'encode') {
                    output.value = encodeURIComponent(input);
                } else {
                    output.value = decodeURIComponent(input);
                }
            } catch(e) {
                output.value = '错误: 非法的 URL 编码序列';
            }
        }
    </script>
</body>
</html>
