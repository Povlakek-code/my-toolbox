<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多进制转换器 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">🔢 常用进制转换</h2>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-0.5">2 进制 (Binary)</label>
                <input type="text" id="num-2" class="w-full p-2 border border-gray-300 font-mono text-sm rounded focus:ring-2 focus:ring-blue-500" placeholder="例如: 101010" oninput="convert(2, this.value)">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-0.5">8 进制 (Octal)</label>
                <input type="text" id="num-8" class="w-full p-2 border border-gray-300 font-mono text-sm rounded focus:ring-2 focus:ring-blue-500" placeholder="例如: 52" oninput="convert(8, this.value)">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-0.5">10 进制 (Decimal)</label>
                <input type="text" id="num-10" class="w-full p-2 border border-gray-300 font-mono text-sm rounded focus:ring-2 focus:ring-blue-500" placeholder="例如: 42" oninput="convert(10, this.value)">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-0.5">16 进制 (Hexadecimal)</label>
                <input type="text" id="num-16" class="w-full p-2 border border-gray-300 font-mono text-sm rounded focus:ring-2 focus:ring-blue-500" placeholder="例如: 2a" oninput="convert(16, this.value)">
            </div>
        </div>
    </div>

    <script>
        function convert(base, value) {
            value = value.trim();
            if (!value) {
                clearAll();
                return;
            }

            // 先转成 10 进制大数或整数
            let decimalValue;
            try {
                decimalValue = parseInt(value, base);
                if (isNaN(decimalValue)) return;
            } catch (e) {
                return;
            }

            // 联动更新其他输入框
            if (base !== 2) document.getElementById('num-2').value = decimalValue.toString(2);
            if (base !== 8) document.getElementById('num-8').value = decimalValue.toString(8);
            if (base !== 10) document.getElementById('num-10').value = decimalValue.toString(10);
            if (base !== 16) document.getElementById('num-16').value = decimalValue.toString(16);
        }

        function clearAll() {
            document.getElementById('num-2').value = '';
            document.getElementById('num-8').value = '';
            document.getElementById('num-10').value = '';
            document.getElementById('num-16').value = '';
        }
    </script>
</body>
</html>
