<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV / JSON 互转 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">📊 CSV ↔ JSON 数据互转</h2>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <textarea id="data-csv" rows="8" class="p-2 border font-mono text-xs rounded" placeholder="CSV 格式：&#10;name,age&#10;Tom,18"></textarea>
            <textarea id="data-json" rows="8" class="p-2 border font-mono text-xs rounded" placeholder="JSON 格式：&#10;[&#10;  {&quot;name&quot;:&quot;Tom&quot;,&quot;age&quot;:18}&#10;]"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-2 mt-4">
            <button onclick="csvToJson()" class="bg-blue-600 text-white py-2 rounded text-xs">CSV 转成 JSON →</button>
            <button onclick="jsonToCsv()" class="bg-gray-800 text-white py-2 rounded text-xs">← JSON 转成 CSV</button>
        </div>
    </div>
    <script>
        function csvToJson() {
            const csv = document.getElementById('data-csv').value.trim().split('\n');
            if(csv.length < 2) return;
            const headers = csv[0].split(',');
            const res = csv.slice(1).map(line => {
                const values = line.split(',');
                return Object.fromEntries(headers.map((h, i) => [h.trim(), values[i]?.trim()]));
            });
            document.getElementById('data-json').value = JSON.stringify(res, null, 2);
        }
        function jsonToCsv() {
            const json = JSON.parse(document.getElementById('data-json').value.trim());
            const headers = Object.keys(json[0]);
            const rows = json.map(obj => headers.map(h => obj[h]).join(','));
            document.getElementById('data-csv').value = [headers.join(','), ...rows].join('\n');
        }
    </script>
</body>
</html>
