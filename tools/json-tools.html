<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 格式化工具 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">📊 JSON 格式化与美化</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 输入框 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">输入原始 JSON:</label>
                <textarea id="json-input" rows="12" class="w-full p-3 border border-gray-300 rounded-lg font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请在此处粘贴 JSON 字符串..."></textarea>
            </div>
            <!-- 输出框 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">处理结果:</label>
                <textarea id="json-output" rows="12" readonly class="w-full p-3 border border-gray-300 rounded-lg font-mono text-sm bg-gray-50 focus:outline-none" placeholder="转换结果将显示在这里..."></textarea>
            </div>
        </div>

        <!-- 错误提示 -->
        <div id="json-error" class="mt-2 text-sm text-red-600 hidden"></div>

        <!-- 操作按钮 -->
        <div class="mt-4 flex flex-wrap gap-2">
            <button onclick="handleJson('format')" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">格式化 (2空格)</button>
            <button onclick="handleJson('minify')" class="bg-gray-600 text-white px-4 py-2 rounded text-sm hover:bg-gray-700">压缩 (单行)</button>
            <button onclick="copyOutput()" class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700">复制结果</button>
            <button onclick="clearAll()" class="bg-red-500 text-white px-4 py-2 rounded text-sm hover:bg-red-600 ml-auto">清空</button>
        </div>
    </div>

    <script>
        const input = document.getElementById('json-input');
        const output = document.getElementById('json-output');
        const errorDiv = document.getElementById('json-error');

        function handleJson(action) {
            errorDiv.classList.add('hidden');
            const val = input.value.trim();
            if (!val) return;

            try {
                const parsed = JSON.parse(val);
                if (action === 'format') {
                    output.value = JSON.stringify(parsed, null, 2);
                } else if (action === 'minify') {
                    output.value = JSON.stringify(parsed);
                }
            } catch (e) {
                errorDiv.innerText = '❌ JSON 格式错误: ' + e.message;
                errorDiv.classList.remove('hidden');
                output.value = '';
            }
        }

        function copyOutput() {
            if(!output.value) return;
            navigator.clipboard.writeText(output.value);
            alert('结果已复制到剪贴板！');
        }

        function clearAll() {
            input.value = '';
            output.value = '';
            errorDiv.classList.add('hidden');
        }
    </script>
</body>
</html>
