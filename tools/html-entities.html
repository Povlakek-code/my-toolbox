<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 实体转换 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">🧬 HTML 实体字符转义</h2>
        </div>
        <div class="space-y-4">
            <textarea id="html-src" rows="5" class="w-full p-2 border rounded-lg font-mono text-sm" placeholder="输入纯文本源码，如: <h1>Hello</h1>"></textarea>
            <div class="flex gap-2">
                <button onclick="escapeHTML()" class="flex-1 bg-blue-600 text-white py-2 rounded text-sm">转义 (&amp;lt;)</button>
                <button onclick="unescapeHTML()" class="flex-1 bg-gray-800 text-white py-2 rounded text-sm">反转义 (&lt;)</button>
            </div>
        </div>
    </div>
    <script>
        function escapeHTML() {
            const src = document.getElementById('html-src').value;
            document.getElementById('html-src').value = src.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        function unescapeHTML() {
            const src = document.getElementById('html-src').value;
            const doc = new DOMParser().parseFromString(src, "text/html");
            document.getElementById('html-src').value = doc.documentElement.textContent;
        }
    </script>
</body>
</html>
