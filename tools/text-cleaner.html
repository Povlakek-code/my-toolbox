<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本清洗去重 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">🧹 原始文本去重与正向排序</h2>
        </div>
        <textarea id="clean-input" rows="6" class="w-full p-2 border font-mono text-sm rounded-lg" placeholder="输入一长串带有很多重复行的文本..."></textarea>
        <div class="grid grid-cols-2 gap-2 mt-4">
            <button onclick="cleanText(true)" class="bg-blue-600 text-white py-2 rounded text-xs">去重 + A-Z 排序</button>
            <button onclick="cleanText(false)" class="bg-gray-800 text-white py-2 rounded text-xs">仅物理去重</button>
        </div>
    </div>
    <script>
        function cleanText(sort) {
            const input = document.getElementById('clean-input').value.split('\n').map(l => l.trim()).filter(l => l);
            let unique = [...new Set(input)];
            if(sort) unique.sort();
            document.getElementById('clean-input').value = unique.join('\n');
            alert(`清理完毕！已收拢并去重。`);
        }
    </script>
</body>
</html>
