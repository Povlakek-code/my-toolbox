<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片压缩转换 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">🖼️ 图片本地压缩与转换</h2>
        </div>

        <div class="space-y-4">
            <!-- 文件的选择 -->
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-blue-500 transition-colors">
                <input type="file" id="image-input" accept="image/*" class="hidden" onchange="loadImage(event)">
                <label for="image-input" class="cursor-pointer text-sm text-gray-600">
                    <span class="text-blue-600 font-medium">点击上传图片</span> 或将图片拖拽到此处
                </label>
                <div id="file-info" class="text-xs text-gray-400 mt-1"></div>
            </div>

            <!-- 控制面板 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">目标格式:</label>
                    <select id="output-format" class="w-full p-2 border border-gray-300 rounded bg-white text-sm">
                        <option value="image/jpeg">JPEG (.jpg)</option>
                        <option value="image/png">PNG (.png)</option>
                        <option value="image/webp">WebP (.webp)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">压缩质量: <span id="quality-val">80%</span></label>
                    <input type="range" id="output-quality" min="10" max="100" value="80" class="w-full" oninput="document.getElementById('quality-val').innerText=this.value+'%'">
                </div>
            </div>

            <button onclick="processImage()" class="w-full bg-emerald-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-emerald-700">开始处理图片</button>

            <!-- 结果对比与下载 -->
            <div id="result-area" class="hidden border-t pt-4 space-y-3">
                <div class="text-sm font-medium text-green-700">处理成功！</div>
                <div class="text-xs text-gray-500">原图大小: <span id="old-size"></span> ➔ 处理后大小: <span id="new-size" class="font-bold text-gray-800"></span></div>
                <img id="preview" class="max-h-64 mx-auto border rounded shadow-sm">
                <a id="download-link" class="block text-center bg-gray-900 text-white py-2 rounded-lg text-sm font-medium hover:bg-gray-800">下载处理后的图片</a>
            </div>
        </div>
    </div>

    <script>
        let sourceImg = new Image();

        function loadImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            document.getElementById('file-info').innerText = `${file.name} (${(file.size/1024).toFixed(1)} KB)`;
            document.getElementById('old-size').innerText = `${(file.size/1024).toFixed(1)} KB`;

            const reader = new FileReader();
            reader.onload = function(event) {
                sourceImg.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        function processImage() {
            if (!sourceImg.src) {
                alert('请先上传一张图片！');
                return;
            }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = sourceImg.naturalWidth;
            canvas.height = sourceImg.naturalHeight;
            ctx.drawImage(sourceImg, 0, 0);

            const format = document.getElementById('output-format').value;
            const quality = parseInt(document.getElementById('output-quality').value) / 100;

            // 导出图片
            const resultDataUrl = canvas.toDataURL(format, quality);
            
            // 计算导出后的大小
            const head = resultDataUrl.split(',')[0];
            const base64Str = resultDataUrl.split(',')[1];
            const newSizeBytes = atob(base64Str).length;

            // 更新UI
            document.getElementById('new-size').innerText = `${(newSizeBytes/1024).toFixed(1)} KB`;
            const preview = document.getElementById('preview');
            preview.src = resultDataUrl;

            const downloadLink = document.getElementById('download-link');
            downloadLink.href = resultDataUrl;
            downloadLink.download = "processed_" + (format === 'image/jpeg' ? 'image.jpg' : format === 'image/png' ? 'image.png' : 'image.webp');

            document.getElementById('result-area').classList.remove('hidden');
        }
    </script>
</body>
</html>
