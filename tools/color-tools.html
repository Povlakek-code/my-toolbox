<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色转换工具 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">🎨 颜色转换与拾取器</h2>
        </div>

        <div class="space-y-4">
            <!-- 颜色选择面板 -->
            <div class="flex gap-4 items-center bg-gray-50 p-3 rounded-lg">
                <input type="color" id="color-picker" value="#3b82f6" class="w-16 h-16 border-0 cursor-pointer rounded" oninput="syncFromPicker(this.value)">
                <div class="flex-1">
                    <span class="text-xs text-gray-500 block">实时预览：</span>
                    <div id="color-preview" class="w-full h-8 rounded mt-1 shadow-inner bg-blue-500"></div>
                </div>
            </div>

            <!-- HEX -->
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-0.5">HEX (十六进制)</label>
                <div class="flex gap-2">
                    <input type="text" id="color-hex" value="#3b82f6" class="flex-1 p-2 border border-gray-300 font-mono text-sm rounded">
                    <button onclick="convertFromHex()" class="bg-gray-800 text-white px-3 py-1.5 rounded text-xs">应用</button>
                </div>
            </div>

            <!-- RGB -->
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-0.5">RGB 格式</label>
                <input type="text" id="color-rgb" readonly class="w-full p-2 border border-gray-100 bg-gray-50 font-mono text-sm rounded">
            </div>

            <!-- HSL -->
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-0.5">HSL 格式</label>
                <input type="text" id="color-hsl" readonly class="w-full p-2 border border-gray-100 bg-gray-50 font-mono text-sm rounded">
            </div>
        </div>
    </div>

    <script>
        // 十六进制转RGB
        function hexToRgb(hex) {
            let shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
            hex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        // RGB转HSL
        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max == min) {
                h = s = 0; // achromatic
            } else {
                let d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return `hsl(${Math.round(h * 360)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`;
        }

        function updateAllDisplays(hex) {
            document.getElementById('color-preview').style.backgroundColor = hex;
            document.getElementById('color-hex').value = hex;
            
            const rgb = hexToRgb(hex);
            if(rgb) {
                document.getElementById('color-rgb').value = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
                document.getElementById('color-hsl').value = rgbToHsl(rgb.r, rgb.g, rgb.b);
            }
        }

        function syncFromPicker(val) {
            updateAllDisplays(val);
        }

        function convertFromHex() {
            let hex = document.getElementById('color-hex').value.trim();
            if(!hex.startsWith('#')) hex = '#' + hex;
            if(/^#[0-9A-F]{6}$/i.test(hex) || /^#[0-9A-F]{3}$/i.test(hex)) {
                document.getElementById('color-picker').value = hex;
                updateAllDisplays(hex);
            } else {
                alert('请输入合法的 HEX 颜色代码，如 #FF5733');
            }
        }

        // 默认初始化
        window.onload = () => updateAllDisplays('#3b82f6');
    </script>
</body>
</html>
