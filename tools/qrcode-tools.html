<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成器 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入轻量级二维码生成库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">📱 二维码生成器</h2>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">输入网址或文本内容:</label>
                <textarea id="qr-text" rows="3" class="w-full p-2 border border-gray-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-blue-500" placeholder="https://example.com"></textarea>
            </div>

            <button onclick="generateQR()" class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-blue-700">生成二维码</button>

            <!-- 二维码展示区 -->
            <div class="flex flex-col items-center justify-center pt-4">
                <div id="qrcode" class="p-2 bg-white border border-gray-200 rounded-lg"></div>
                <button id="download-btn" onclick="downloadQR()" class="mt-4 text-xs bg-gray-800 text-white px-3 py-1.5 rounded hover:bg-gray-900 hidden">下载二维码</button>
            </div>
        </div>
    </div>

    <script>
        let qrContainer = document.getElementById("qrcode");
        let qrcodeImpl = null;

        function generateQR() {
            const text = document.getElementById("qr-text").value.trim();
            if (!text) {
                alert("请输入内容！");
                return;
            }

            // 清空旧的二维码
            qrContainer.innerHTML = "";
            
            // 初始化并生成新二维码
            qrcodeImpl = new QRCode(qrContainer, {
                text: text,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // 稍微延迟一下等Canvas/Img渲染完，显示下载按钮
            setTimeout(() => {
                document.getElementById("download-btn").classList.remove("hidden");
            }, 100);
        }

        function downloadQR() {
            const img = qrContainer.querySelector("img");
            if (img) {
                const a = document.createElement("a");
                a.href = img.src;
                a.download = "qrcode.png";
                a.click();
            }
        }
    </script>
</body>
</html>
