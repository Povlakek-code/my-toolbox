<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本差异对比 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-5xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">⚖️ 文本差异对比工具</h2>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">原文本 (版本 A):</label>
                <textarea id="text-a" rows="8" class="w-full p-2 border border-gray-200 font-mono text-sm rounded-lg" placeholder="在此输入原始文本..."></textarea>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">新文本 (版本 B):</label>
                <textarea id="text-b" rows="8" class="w-full p-2 border border-gray-200 font-mono text-sm rounded-lg" placeholder="在此输入修改后的文本..."></textarea>
            </div>
        </div>
        <button onclick="compareTexts()" class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-blue-700">开始逐行对比</button>
        <div class="mt-6">
            <label class="block text-xs font-bold text-gray-500 mb-1">对比结果:</label>
            <div id="diff-output" class="border border-gray-200 rounded-lg p-4 bg-gray-50 font-mono text-sm min-h-[150px] whitespace-pre-wrap leading-relaxed"></div>
        </div>
    </div>
    <script>
        function compareTexts() {
            const linesA = document.getElementById('text-a').value.split('\n');
            const linesB = document.getElementById('text-b').value.split('\n');
            let output = '';
            const maxLines = Math.max(linesA.length, linesB.length);
            for (let i = 0; i < maxLines; i++) {
                const lineA = linesA[i] || '';
                const lineB = linesB[i] || '';
                if (lineA === lineB) {
                    if (linesA[i] !== undefined || linesB[i] !== undefined) {
                        output += `<div class="text-gray-500 pl-4">  ${lineA}</div>`;
                    }
                } else {
                    if (linesA[i] !== undefined) {
                        output += `<div class="bg-red-100 text-red-700 px-2 rounded">-(第${i+1}行) ${lineA}</div>`;
                    }
                    if (linesB[i] !== undefined) {
                        output += `<div class="bg-green-100 text-green-700 px-2 rounded">+(第${i+1}行) ${lineB}</div>`;
                    }
                }
            }
            document.getElementById('diff-output').innerHTML = output || '<span class="text-gray-400">两段文本完全一致</span>';
        }
    </script>
</body>
</html>
