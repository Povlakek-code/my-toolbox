<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片转 Base64 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">🖼️ 图片转 Base64 编码</h2>
        </div>

        <div class="space-y-4">
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-blue-500 transition-colors">
                <input type="file" id="img-file" accept="image/*" class="hidden" onchange="convertToBase64()">
                <label for="img-file" class="cursor-pointer text-sm text-gray-600">
                    <span class="text-blue-600 font-medium">点击选择图片</span> 开始转换
                </label>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-1 p-2 border rounded-lg bg-gray-50 flex items-center justify-center min-h-[150px]">
                    <img id="img-preview" class="max-h-36 max-w-full hidden shadow-xs">
                    <span id="preview-placeholder" class="text-xs text-gray-400">暂无预览</span>
                </div>
                <div class="md:col-span-2 flex flex-col">
                    <label class="text-xs font-bold text-gray-500 mb-1">Base64 DataURI 结果:</label>
                    <textarea id="b64-output" readonly rows="6" class="w-full flex-grow p-2 border border-gray-200 bg-gray-50 font-mono text-xs rounded-lg focus:outline-none" placeholder="转换结果将显示在这里..."></textarea>
                </div>
            </div>

            <button onclick="copyB64()" class="w-full bg-gray-900 text-white py-2 rounded text-sm hover:bg-gray-800">复制完整代码</button>
        </div>
    </div>

    <script>
        function convertToBase64() {
            const file = document.getElementById('img-file').files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Result = e.target.result;
                document.getElementById('b64-output').value = base64Result;
                
                const preview = document.getElementById('img-preview');
                preview.src = base64Result;
                preview.classList.remove('hidden');
                document.getElementById('preview-placeholder').classList.add('hidden');
            }
            reader.readAsDataURL(file);
        }

        function copyB64() {
            const val = document.getElementById('b64-output').value;
            if(!val) return;
            navigator.clipboard.writeText(val);
            alert('Base64 代码已复制！');
        }
    </script>
</body>
</html>
