<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哈希生成器 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入标准加密算法库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">🛡️ 哈希/散列值生成器</h2>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">输入原始文本:</label>
                <textarea id="hash-input" rows="4" class="w-full p-3 border border-gray-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-blue-500" placeholder="在此输入需要计算哈希的字符串..." oninput="calculateHash()"></textarea>
            </div>

            <!-- 结果列表 -->
            <div class="space-y-3 bg-gray-50 p-4 rounded-lg">
                <div>
                    <label class="text-xs font-bold text-gray-500 block">MD5</label>
                    <div class="flex gap-2 mt-0.5">
                        <input type="text" id="res-md5" readonly class="flex-1 p-1.5 border border-gray-200 bg-white font-mono text-xs rounded">
                        <button onclick="copyVal('res-md5')" class="text-xs bg-gray-200 px-2 py-1 rounded hover:bg-gray-300">复制</button>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500 block">SHA-1</label>
                    <div class="flex gap-2 mt-0.5">
                        <input type="text" id="res-sha1" readonly class="flex-1 p-1.5 border border-gray-200 bg-white font-mono text-xs rounded">
                        <button onclick="copyVal('res-sha1')" class="text-xs bg-gray-200 px-2 py-1 rounded hover:bg-gray-300">复制</button>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500 block">SHA-256</label>
                    <div class="flex gap-2 mt-0.5">
                        <input type="text" id="res-sha256" readonly class="flex-1 p-1.5 border border-gray-200 bg-white font-mono text-xs rounded">
                        <button onclick="copyVal('res-sha256')" class="text-xs bg-gray-200 px-2 py-1 rounded hover:bg-gray-300">复制</button>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500 block">SHA-512</label>
                    <div class="flex gap-2 mt-0.5">
                        <input type="text" id="res-sha512" readonly class="flex-1 p-1.5 border border-gray-200 bg-white font-mono text-xs rounded">
                        <button onclick="copyVal('res-sha512')" class="text-xs bg-gray-200 px-2 py-1 rounded hover:bg-gray-300">复制</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateHash() {
            const str = document.getElementById('hash-input').value;
            if(!str) {
                document.getElementById('res-md5').value = '';
                document.getElementById('res-sha1').value = '';
                document.getElementById('res-sha256').value = '';
                document.getElementById('res-sha512').value = '';
                return;
            }
            document.getElementById('res-md5').value = CryptoJS.MD5(str).toString();
            document.getElementById('res-sha1').value = CryptoJS.SHA1(str).toString();
            document.getElementById('res-sha256').value = CryptoJS.SHA256(str).toString();
            document.getElementById('res-sha512').value = CryptoJS.SHA512(str).toString();
        }

        function copyVal(id) {
            const el = document.getElementById(id);
            if(!el.value) return;
            navigator.clipboard.writeText(el.value);
            alert('复制成功！');
        }
    </script>
</body>
</html>
