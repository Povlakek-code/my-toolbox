<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民币大写转换 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">💰 人民币大写在线转换</h2>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">输入小写金额 (￥):</label>
                <input type="number" id="rmb-input" step="0.01" class="w-full p-2.5 border border-gray-300 font-mono rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="数字，如 12345.67" oninput="convertToChineseRMB()">
            </div>

            <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                <span class="text-xs text-blue-700 font-semibold block mb-1">财务大写结果：</span>
                <div id="rmb-output" class="font-bold text-gray-900 break-all select-all text-base font-serif">零元整</div>
            </div>
            
            <button onclick="navigator.clipboard.writeText(document.getElementById('rmb-output').innerText); alert('复制大写成功！')" class="w-full bg-gray-900 text-white py-2 rounded text-sm hover:bg-gray-800">复制结果</button>
        </div>
    </div>

    <script>
        function convertToChineseRMB() {
            const money = document.getElementById('rmb-input').value;
            const output = document.getElementById('rmb-output');
            
            if (!money || isNaN(money) || money < 0) {
                output.innerText = "零元整";
                return;
            }

            let fraction = ['角', '分'];
            let digit = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'];
            let unit = [ ['元', '万', '亿'], ['', '拾', '佰', '仟'] ];
            
            let num = Math.abs(money);
            let s = '';

            // 处理小数部分
            let parts = money.split('.');
            let dec = parts[1] || '';
            
            let s_dec = '';
            for (let i = 0; i < Math.min(dec.length, 2); i++) {
                s_dec += (digit[dec.charAt(i)] + fraction[i]).replace(/零./, '');
            }
            if(s_dec === '') s_dec = '整';

            // 处理整数部分
            let integer = Math.floor(num);
            let s_int = '';
            for (let i = 0; i < unit[0].length && integer > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && integer > 0; j++) {
                    p = digit[integer % 10] + unit[1][j] + p;
                    integer = Math.floor(integer / 10);
                }
                s_int = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s_int;
            }
            
            s_int = s_int.replace(/(零.)*零元/, '元').replace(/(零.)+/g, '零').replace(/^元/, '');
            
            let result = s_int + s_dec;
            if (result === '整') result = '零元整';
            if (result.startsWith('整')) result = result.replace('整', '零元整');
            
            output.innerText = result;
        }
    </script>
</body>
</html>
