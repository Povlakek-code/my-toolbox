<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实用单位换算 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">📐 常用单位换算矩阵</h2>
        </div>
        <div class="space-y-6">
            <!-- 长度 -->
            <div class="p-4 bg-gray-50 rounded-xl border">
                <span class="text-xs font-bold text-gray-400 block mb-2">📏 长度级联转换</span>
                <div class="grid grid-cols-2 gap-2 text-sm">
                    <div>米 (m): <input type="number" id="unit-m" class="w-full p-1.5 border rounded" oninput="calcLength('m')"></div>
                    <div>厘米 (cm): <input type="number" id="unit-cm" class="w-full p-1.5 border rounded" oninput="calcLength('cm')"></div>
                    <div>英寸 (in): <input type="number" id="unit-in" class="w-full p-1.5 border rounded" oninput="calcLength('in')"></div>
                    <div>英尺 (ft): <input type="number" id="unit-ft" class="w-full p-1.5 border rounded" oninput="calcLength('ft')"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function calcLength(type) {
            const val = parseFloat(document.getElementById('unit-' + type).value);
            if(isNaN(val)) return;
            let meters = 0;
            if(type === 'm') meters = val;
            if(type === 'cm') meters = val / 100;
            if(type === 'in') meters = val * 0.0254;
            if(type === 'ft') meters = val * 0.3048;

            if(type !== 'm') document.getElementById('unit-m').value = meters.toFixed(4);
            if(type !== 'cm') document.getElementById('unit-cm').value = (meters * 100).toFixed(4);
            if(type !== 'in') document.getElementById('unit-in').value = (meters / 0.0254).toFixed(4);
            if(type !== 'ft') document.getElementById('unit-ft').value = (meters / 0.3048).toFixed(4);
        }
    </script>
</body>
</html>
