<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>瑞士军刀 Toolbox Pro</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  min-height:100vh;
  background:linear-gradient(135deg,#eef2ff,#fdf2f8);
}

/* 动态背景 */
.bg-light{
  position:fixed; inset:0; z-index:-1;
}
.bg-light div{
  position:absolute;border-radius:50%;filter:blur(100px);
}
.bg1{width:400px;height:400px;background:#6366f1;left:-100px;top:-100px;}
.bg2{width:500px;height:500px;background:#0ea5e9;right:-150px;top:20%;}
.bg3{width:500px;height:500px;background:#f472b6;bottom:-200px;left:30%;}

/* 卡片 */
.tool-card{
  position:relative;
  transition:.2s;
}
.tool-card:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:0 20px 60px rgba(0,0,0,.15);
}
.tool-card:active{transform:scale(.96);}

/* ripple */
.ripple{
 position:absolute;width:120px;height:120px;border-radius:50%;
 background:rgba(99,102,241,.3);
 transform:translate(-50%,-50%);
 animation:ripple .6s;
}
@keyframes ripple{
 from{opacity:.6;transform:scale(.5);}
 to{opacity:0;transform:scale(2);}
}

/* dark */
.dark body{background:#0f172a;color:#e2e8f0;}
.dark .card{background:#1e293b;}

.hidden{display:none!important;}
</style>
</head>

<body>

<div class="bg-light">
  <div class="bg1"></div>
  <div class="bg2"></div>
  <div class="bg3"></div>
</div>

<main class="max-w-7xl mx-auto p-6">

<!-- HEADER -->
<header class="flex justify-between items-center mb-6">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-pink-500 text-white flex items-center justify-center font-bold">✦</div>
    <div>
      <div class="font-black text-lg">Toolbox Pro</div>
      <div class="text-xs text-slate-500">by Soren</div>
    </div>
  </div>

  <div class="flex gap-3">
    <button id="cmdBtn">⌘</button>
    <button id="darkBtn">🌙</button>
  </div>
</header>

<!-- SEARCH -->
<input id="search" placeholder="搜索工具（按 / 快捷键）"
class="w-full p-3 rounded-xl mb-4 shadow"/>

<!-- 分类 -->
<div class="flex flex-wrap gap-2 mb-4">
  <button class="tab active" data="all">全部</button>
  <button class="tab" data="dev">开发</button>
  <button class="tab" data="game">游戏</button>
</div>

<!-- 最近使用 -->
<div id="recent" class="text-sm text-slate-500 mb-3"></div>

<!-- grid -->
<div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">

<a class="tool-card card p-4 bg-white rounded-xl"
href="./tools/json-tools.html" data-cat="dev">
📊 JSON工具 ⭐
</a>

<a class="tool-card card p-4 bg-white rounded-xl"
href="./tools/base64-tools.html" data-cat="dev">
🔒 Base64
</a>

<a class="tool-card card p-4 bg-white rounded-xl"
href="./games/game-snake.html" data-cat="game">
🐍 贪吃蛇
</a>

<a class="tool-card card p-4 bg-white rounded-xl"
href="./games/game-2048.html" data-cat="game">
🎲 2048
</a>

</div>

</main>

<!-- CMD 面板 -->
<div id="cmd"
class="hidden fixed inset-0 bg-black/40 flex items-start justify-center pt-40">

<div class="bg-white w-[420px] rounded-xl p-3 shadow-xl">
<input id="cmdInput" placeholder="输入工具名"
class="w-full p-2 border rounded mb-2"/>
<div id="cmdList"></div>
</div>
</div>

<script>
const cards=[...document.querySelectorAll(".tool-card")];
const search=document.getElementById("search");
const tabs=document.querySelectorAll(".tab");

let current="all";

/* 分类 */
tabs.forEach(btn=>{
  btn.onclick=()=>{
    tabs.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    current=btn.dataset.data;
    filter();
  }
});

/* 搜索 */
search.oninput=filter;

function filter(){
  const key=search.value.toLowerCase();
  cards.forEach(c=>{
    const show=(current==="all"||c.dataset.cat===current)
      && c.innerText.toLowerCase().includes(key);
    c.classList.toggle("hidden",!show);
  });
}

/* 快捷键 / */
document.addEventListener("keydown",e=>{
  if(e.key==="/"){
    e.preventDefault();
    search.focus();
  }
});

/* ripple */
cards.forEach(c=>{
  c.onclick=e=>{
    const r=document.createElement("div");
    r.className="ripple";
    const rect=c.getBoundingClientRect();
    r.style.left=(e.clientX-rect.left)+"px";
    r.style.top=(e.clientY-rect.top)+"px";
    c.appendChild(r);
    setTimeout(()=>r.remove(),600);

    /* 最近使用 */
    localStorage.setItem("last",c.innerText);
  }
});

/* 最近 */
const last=localStorage.getItem("last");
if(last){
 document.getElementById("recent").innerText="最近："+last;
}

/* dark */
const darkBtn=document.getElementById("darkBtn");
darkBtn.onclick=()=>{
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("dark",document.documentElement.classList.contains("dark"));
}
if(localStorage.getItem("dark")==="true"){
 document.documentElement.classList.add("dark");
}

/* CMD 面板 */
const cmd=document.getElementById("cmd");
const cmdInput=document.getElementById("cmdInput");
const cmdList=document.getElementById("cmdList");

document.getElementById("cmdBtn").onclick=()=>{
  cmd.classList.remove("hidden");
  cmdInput.focus();
};

cmd.onclick=e=>{
  if(e.target===cmd)cmd.classList.add("hidden");
};

cmdInput.oninput=()=>{
 const key=cmdInput.value.toLowerCase();
 cmdList.innerHTML="";
 cards.forEach(c=>{
  if(c.innerText.toLowerCase().includes(key)){
    const item=document.createElement("div");
    item.textContent=c.innerText;
    item.className="p-2 hover:bg-gray-100 cursor-pointer";
    item.onclick=()=>location.href=c.href;
    cmdList.appendChild(item);
  }
 });
};
</script>

</body>
</html>
