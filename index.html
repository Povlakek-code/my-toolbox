<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>瑞士军刀 Toolbox</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  min-height:100vh;
  background: linear-gradient(135deg,#eef2ff,#fdf2f8);
}

/* 背景动态光 */
.bg-blur{
  position:fixed; inset:0; pointer-events:none; z-index:-1;
}
.bg-blur div{
  position:absolute;border-radius:50%;filter:blur(100px);
}
.bg1{width:400px;height:400px;background:#6366f1;left:-100px;top:-100px;}
.bg2{width:500px;height:500px;background:#22d3ee;right:-150px;top:20%;}
.bg3{width:500px;height:500px;background:#f472b6;bottom:-200px;left:30%;}

/* 卡片 */
.tool-card{
  position:relative;
  transition:all .2s;
}
.tool-card:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:0 25px 60px rgba(0,0,0,.15);
}
.tool-card:active{
  transform:scale(.97);
}

/* ripple */
.ripple{
  position:absolute;
  width:120px;height:120px;border-radius:50%;
  background:rgba(99,102,241,.3);
  transform:translate(-50%,-50%);
  animation:ripple .6s;
}
@keyframes ripple{
  from{opacity:.6;transform:translate(-50%,-50%) scale(.5);}
  to{opacity:0;transform:translate(-50%,-50%) scale(2);}
}

/* hidden */
.hidden{display:none!important;}
</style>
</head>

<body class="text-slate-800">

<div class="bg-blur">
  <div class="bg1"></div>
  <div class="bg2"></div>
  <div class="bg3"></div>
</div>

<main class="max-w-7xl mx-auto p-6">

<!-- Header -->
<header class="mb-6">
  <div class="flex justify-between items-center">
    
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-pink-500 text-white flex items-center justify-center font-bold">✦</div>
      <div>
        <div class="font-black text-lg">瑞士军刀 Toolbox</div>
        <div class="text-xs text-slate-500">by Soren</div>
      </div>
    </div>

    <button id="darkBtn">🌙</button>
  </div>

  <p class="mt-4 text-sm text-slate-600">
    一个纯前端工具 + 游戏集合
  </p>

  <!-- 搜索 -->
  <input id="search"
    class="mt-4 w-full p-3 rounded-xl shadow"
    placeholder="搜索..."
  />

</header>

<!-- 分类 -->
<div class="flex gap-2 flex-wrap mb-6">
  <button class="tab active bg-white px-3 py-1 rounded-full" data="all">全部</button>
  <button class="tab bg-white px-3 py-1 rounded-full" data="dev">开发</button>
  <button class="tab bg-white px-3 py-1 rounded-full" data="text">文本</button>
  <button class="tab bg-white px-3 py-1 rounded-full" data="image">图片</button>
  <button class="tab bg-white px-3 py-1 rounded-full" data="daily">日常</button>
  <button class="tab bg-white px-3 py-1 rounded-full" data="game">游戏</button>
</div>

<!-- 随机推荐 -->
<div id="random" class="text-sm text-slate-500 mb-4"></div>

<!-- 卡片 -->
<div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">

<a class="tool-card p-4 bg-white rounded-2xl shadow" href="./tools/json-tools.html" data-cat="dev">
  <div>📊 JSON工具</div>
</a>

<a class="tool-card p-4 bg-white rounded-2xl shadow" href="./tools/base64-tools.html" data-cat="dev">
  <div>🔒 Base64</div>
</a>

<a class="tool-card p-4 bg-white rounded-2xl shadow" href="./tools/text-tools.html" data-cat="text">
  <div>🔤 文本工具</div>
</a>

<a class="tool-card p-4 bg-white rounded-2xl shadow" href="./tools/image-tools.html" data-cat="image">
  <div>🖼️ 图片处理</div>
</a>

<a class="tool-card p-4 bg-white rounded-2xl shadow" href="./tools/password-generator.html" data-cat="daily">
  <div>🔑 密码生成</div>
</a>

<a class="tool-card p-4 bg-white rounded-2xl shadow" href="./games/game-snake.html" data-cat="game">
  <div>🐍 贪吃蛇</div>
</a>

</div>

</main>

<script>
const cards=[...document.querySelectorAll(".tool-card")];
const search=document.getElementById("search");
const tabs=document.querySelectorAll(".tab");

let current="all";

/* 分类 */
tabs.forEach(btn=>{
  btn.onclick=()=>{
    tabs.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    current=btn.dataset.data;
    filter();
  }
});

/* 搜索 */
search.oninput=filter;

function filter(){
  const key=search.value.toLowerCase();
  let count=0;

  cards.forEach(c=>{
    const text=c.innerText.toLowerCase();
    const cat=c.dataset.cat;

    const show=(current==="all"||cat===current)
      && (!key||text.includes(key));

    c.classList.toggle("hidden",!show);

    if(show) count++;
  });
}

/* ripple */
cards.forEach(card=>{
  card.addEventListener("click",e=>{
    const r=document.createElement("span");
    r.className="ripple";

    const rect=card.getBoundingClientRect();
    r.style.left=(e.clientX-rect.left)+"px";
    r.style.top=(e.clientY-rect.top)+"px";

    card.appendChild(r);
    setTimeout(()=>r.remove(),600);
  });
});

/* 随机推荐 */
function randomPick(){
  const r=cards[Math.floor(Math.random()*cards.length)];
  document.getElementById("random").innerText="🎯 推荐："+r.innerText;
}
randomPick();

/* 夜间模式 */
document.getElementById("darkBtn").onclick=()=>{
  document.documentElement.classList.toggle("dark");
};

</script>
</body>
</html>
