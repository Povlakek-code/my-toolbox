<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简计算器 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6 flex justify-center items-center">
    <div class="w-full max-w-xs bg-slate-900 text-white p-5 rounded-2xl shadow-xl">
        <div class="mb-4">
            <a href="./index.html" class="text-xs text-blue-400 hover:underline">← 返回工具箱首页</a>
        </div>
        
        <!-- 显示屏 -->
        <div class="bg-slate-800 p-4 rounded-xl text-right mb-4 min-h-[72px] flex flex-col justify-end">
            <div id="calc-expr" class="text-xs text-slate-400 font-mono tracking-wide"></div>
            <div id="calc-screen" class="text-2xl font-bold font-mono tracking-tight text-emerald-400 truncate">0</div>
        </div>

        <!-- 键盘网格 -->
        <div class="grid grid-cols-4 gap-2 text-sm font-mono">
            <button onclick="pressClear()" class="p-3 bg-red-500 hover:bg-red-600 rounded-lg font-bold">C</button>
            <button onclick="pressOp('Math.sqrt(')" class="p-3 bg-slate-700 hover:bg-slate-600 rounded-lg">√</button>
            <button onclick="pressOp('**')" class="p-3 bg-slate-700 hover:bg-slate-600 rounded-lg">^</button>
            <button onclick="pressOp('/')" class="p-3 bg-orange-500 hover:bg-orange-600 rounded-lg font-bold">/</button>

            <button onclick="pressNum('7')" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-lg">7</button>
            <button onclick="pressNum('8')" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-lg">8</button>
            <button onclick="pressNum('9')" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-lg">9</button>
            <button onclick="pressOp('*')" class="p-3 bg-orange-500 hover:bg-orange-600 rounded-lg font-bold">*</button>

            <button onclick="pressNum('4')" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-lg">4</button>
            <button onclick="pressNum('5')" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-lg">5</button>
            <button onclick="pressNum('6')" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-lg">6</button>
            <button onclick="pressOp('-')" class="p-3 bg-orange-500 hover:bg-orange-600 rounded-lg font-bold">-</button>

            <button onclick="pressNum('1')" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-lg">1</button>
            <button onclick="pressNum('2')" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-lg">2</button>
            <button onclick="pressNum('3')" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-lg">3</button>
            <button onclick="pressOp('+')" class="p-3 bg-orange-500 hover:bg-orange-600 rounded-lg font-bold">+</button>

            <button onclick="pressNum('0')" class="grid col-span-2 p-3 bg-slate-800 hover:bg-slate-700 rounded-lg text-left pl-6">0</button>
            <button onclick="pressNum('.')" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-lg">.</button>
            <button onclick="pressEqual()" class="p-3 bg-emerald-500 hover:bg-emerald-600 rounded-lg font-bold">=</button>
        </div>
    </div>

    <script>
        let expr = "";
        const screen = document.getElementById('calc-screen');
        const exprDiv = document.getElementById('calc-expr');

        function pressNum(n) {
            expr += n;
            screen.innerText = expr;
        }
        function pressOp(op) {
            expr += op;
            exprDiv.innerText = expr;
        }
        function pressClear() {
            expr = "";
            screen.innerText = "0";
            exprDiv.innerText = "";
        }
        function pressEqual() {
            try {
                // 原生安全沙箱环境计算结果
                let res = Function('"use strict";return (' + expr + ')')();
                screen.innerText = res;
                expr = String(res);
                exprDiv.innerText = "";
            } catch (e) {
                screen.innerText = "Error";
                expr = "";
            }
        }
    </script>
</body>
</html>
