<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机密码生成器 - 极简工具箱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
        <div class="mb-4">
            <a href="./index.html" class="text-sm text-blue-600 hover:underline">← 返回首页</a>
            <h2 class="text-2xl font-bold mt-2">🎲 强密码生成器</h2>
        </div>

        <!-- 结果展示 -->
        <div class="p-3 bg-gray-100 rounded-lg flex items-center justify-between mb-4">
            <span id="password-display" class="font-mono font-bold text-lg text-blue-900 break-all select-all">点击生成按钮</span>
            <button onclick="copyPassword()" class="text-xs bg-blue-600 text-white px-2 py-1 rounded hover:bg-blue-700 shrink-0 ml-2">复制</button>
        </div>

        <!-- 配置项 -->
        <div class="space-y-3">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">密码长度: <span id="len-val">16</span></label>
                <input type="range" id="pw-length" min="6" max="32" value="16" class="w-full" oninput="document.getElementById('len-val').innerText=this.value">
            </div>

            <div class="space-y-2 pt-2">
                <label class="flex items-center gap-2 text-sm text-gray-700">
                    <input type="checkbox" id="include-upper" checked class="rounded text-blue-600"> 包含大写字母 (A-Z)
                </label>
                <label class="flex items-center gap-2 text-sm text-gray-700">
                    <input type="checkbox" id="include-lower" checked class="rounded text-blue-600"> 包含小写字母 (a-z)
                </label>
                <label class="flex items-center gap-2 text-sm text-gray-700">
                    <input type="checkbox" id="include-nums" checked class="rounded text-blue-600"> 包含数字 (0-9)
                </label>
                <label class="flex items-center gap-2 text-sm text-gray-700">
                    <input type="checkbox" id="include-symbols" checked class="rounded text-blue-600"> 包含特殊符号 (!@#$%^&*)
                </label>
            </div>

            <button onclick="generatePassword()" class="w-full mt-4 bg-gray-900 text-white py-2 rounded-lg font-medium hover:bg-gray-800">生成新密码</button>
        </div>
    </div>

    <script>
        function generatePassword() {
            const length = parseInt(document.getElementById('pw-length').value);
            const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const lowercase = "abcdefghijklmnopqrstuvwxyz";
            const numbers = "0123456789";
            const symbols = "!@#$%^&*()_+~`|}{[]:;?><,./-=";

            let pool = "";
            if (document.getElementById('include-upper').checked) pool += uppercase;
            if (document.getElementById('include-lower').checked) pool += lowercase;
            if (document.getElementById('include-nums').checked) pool += numbers;
            if (document.getElementById('include-symbols').checked) pool += symbols;

            if (!pool) {
                alert('请至少勾选一个选项！');
                return;
            }

            let password = "";
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * pool.length);
                password += pool[randomIndex];
            }

            document.getElementById('password-display').innerText = password;
        }

        function copyPassword() {
            const txt = document.getElementById('password-display').innerText;
            if(txt === '点击生成按钮') return;
            navigator.clipboard.writeText(txt);
            alert('密码已复制！');
        }
        
        // 初始化生成一个
        window.onload = generatePassword;
    </script>
</body>
</html>
